{{- if .Values.gangScheduling.enabled }}
{{- if not (has .Values.gangScheduling.podGroupBackend (list "legacy" "volcano")) }}
{{- fail "pytorch.gangScheduling.podGroupBackend must be legacy or volcano" }}
{{- end }}
{{- if not .Values.gangScheduling.schedulerName }}
{{- fail "pytorch.gangScheduling.schedulerName must not be empty" }}
{{- end }}
{{- if not .Values.imageOverride }}
{{- fail "pytorch.imageOverride must reference a patched Operator supporting --podgroup-backend" }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytorch-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pytorch-operator
      {{- include "arena.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        name: pytorch-operator
        {{- include "arena.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeSelector:
        {{- include "arena.nodeSelector" . | nindent 8 }}
        {{- include "arena.nonEdgeNodeSelector" . | nindent 8 }}
      tolerations:
      {{- with .Values.global.tolerations }}
      {{- . | toYaml | nindent 6 }}
      {{- end }}
      {{- with .Values.tolerations }}
      {{- . | toYaml | nindent 6 }}
      {{- end }}
      {{- include "arena.tolerateNonEdgeNodeSelector" . | nindent 6 }}
      containers:
        - command:
            - /pytorch-operator.v1
            - --alsologtostderr
            - -v=1
            - --monitoring-port=8443
            - --threadiness=4
            - --init-container-image={{ .Values.initContainerImage }}
            {{- if .Values.gangScheduling.enabled }}
            - --enable-gang-scheduling=true
            - {{ printf "--podgroup-backend=%s" .Values.gangScheduling.podGroupBackend | quote }}
            - {{ printf "--gang-scheduler-name=%s" .Values.gangScheduling.schedulerName | quote }}
            {{- end }}
          {{- if .Values.imageOverride }}
          image: {{ .Values.imageOverride | quote }}
          {{- else }}
          image: {{ include "arena.imagePrefix" . }}/{{ .Values.image }}:{{ .Values.tag }}
          {{- end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          name: pytorch-operator
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.initContainerTemplateEnabled }}
          volumeMounts:
            - mountPath: /etc/config
              name: init-container-template
              readOnly: true
          {{- end }}
      serviceAccountName: pytorch-operator
      {{- if .Values.initContainerTemplateEnabled }}
      volumes:
        - name: init-container-template
          configMap:
            name: pytorch-init-container-template
      {{- end }}
