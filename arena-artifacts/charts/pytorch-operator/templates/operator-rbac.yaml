---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: pytorch-operator
    {{- include "arena.labels" . | nindent 4 }}
  name: pytorch-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: pytorch-operator
    {{- include "arena.labels" . | nindent 4 }}
  name: pytorch-operator
rules:
  {{- if or .Values.gangScheduling.enabled .Values.gangScheduling.podGroupRBAC }}
  # Both API groups are read during adoption of pre-upgrade jobs.
  - apiGroups:
      - scheduling.incubator.k8s.io
      - scheduling.volcano.sh
    resources:
      - podgroups
    verbs:
      - get
      - create
      - update
      - delete
  {{- end }}
  - apiGroups:
      - kubeflow.org
    resources:
      - pytorchjobs
      - pytorchjobs/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
      - events
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: pytorch-operator
    {{- include "arena.labels" . | nindent 4 }}
  name: pytorch-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pytorch-operator
subjects:
  - kind: ServiceAccount
    name: pytorch-operator
    namespace: {{ .Release.Namespace }}
